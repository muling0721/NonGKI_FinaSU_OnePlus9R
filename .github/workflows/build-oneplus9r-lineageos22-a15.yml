name: OnePlus 9R SUSFS control test (seccomp enabled)

permissions:
  contents: read

on: workflow_dispatch

env:
  # Device env
  DEVICE_NAME : "oneplus_9r"
  DEVICE_CODENAME : "lemonades"

  CUSTOM_CMDS : "CLANG_TRIPLE=aarch64-linux-gnu-"
  EXTRA_CMDS : "BRAND_SHOW_FLAG=oneplus LD=ld.lld LLVM=1 LLVM_IAS=1 KCFLAGS='-Wno-strict-prototypes -Wno-implicit-int -Wno-incompatible-pointer-types'"

  KERNEL_SOURCE : "https://github.com/wcedla/android_kernel_oneplus_sm8250_los.git"
  KERNEL_BRANCH : "lineage-22.1"

  CLANG_SOURCE : "https://github.com/llvm/llvm-project/releases/download/llvmorg-20.1.0/LLVM-20.1.0-Linux-X64.tar.xz"
  CLANG_BRANCH : ""

  GCC_GNU : false
  GCC_64_SOURCE : "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9.git"
  GCC_64_BRANCH : "android12L-release"
  GCC_32_SOURCE : "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9.git"
  GCC_32_BRANCH : "android12L-release"

  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME : "vendor/kona-perf_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  # FinaSU (KernelSU fork) built into the kernel image
  FINASU_MANAGER_URL : "https://github.com/LyraVoid/FinaSU/releases/download/v1.6.5/FinaSU_v1.6.5_33213-release.apk"

  KERNELSU_SOURCE : "https://raw.githubusercontent.com/LyraVoid/FinaSU/v1.6.5/kernel/setup.sh"
  KERNELSU_BRANCH : "v1.6.5"

  KERNELSU_AUTO_GET : "false"
  KERNELSU_AUTO_FORK : "bakasu"

  SUSFS_ENABLE : true
  SUSFS_FIXED : false

  AK3_SOURCE : "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH : "master"

  BOOT_SOURCE : ""

  NEED_DTBO : false
  NEED_SAFE_DTBO : false

  ROM_TEXT : "lineageos22_a15"

  # Other env
  PYTHON_VERSION: "3"

  PACK_METHOD: "AnyKernel3"
  PACK_KMODULES: "false"

  KERNELSU_METHOD: "shell"

  PATCHES_SOURCE: ""
  PATCHES_BRANCH: ""

  SUSFS_FOLDER_FIXED: ""
  SUSFS_PATCH_FIXED: ""

  REKERNEL_ENABLE: "false"
  DROIDSPACES_ENABLE: "false"
  NOMOUNT_ENABLE: "false"
  FGETPRIORITY_ENABLE: "false"
  VPNHIDE_ENABLE: "false"

  HOOK_METHOD: "syscall"

  KPM_ENABLE: "false"
  KPM_INLINE: "false"
  KPM_KPATCH_NEXT: "false"
  KPM_PATCH_SOURCE: "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU_patch/refs/heads/main/kpm/patch_linux"

  BASEBAND_GUARD_ENABLE: "false"
  BASEBAND_GUARD_BOOT: "false"

  GENERATE_DTB: "false"
  GENERATE_CHIP: "qcom"

  BUILD_DEBUGGER: "true"
  SKIP_PATCH: "true"

  BUILD_OTHER_CONFIG: "false"
  MERGE_CONFIG_FILES: ""

  FREE_MORE_SPACE: "false"

jobs:
  build-kernel:
    name: OnePlus 9R (lemonades) - SUSFS control test
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/test/susfs-control-9r'
    runs-on: ubuntu-24.04
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      BUILD_KEEP_GOING: 'false'

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v6

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: 📦 Get FinaSU Manager
        uses: ./.github/workflows/finasu-manager

      - name: ⚙️ Get necessary tools
        uses: ./.github/workflows/build-ready

      - name: 🪝 Patch Kernel of SUSFS
        uses: ./.github/workflows/patch-susfs

      - name: 🩹 Apply OnePlus 9R SUSFS fixes
        run: |
          cd $GITHUB_WORKSPACE/device_kernel

          # Fix the hunks that the generic 4.19 SUSFS patch cannot handle on
          # this kernel (oplus mount guard block, missing susfs_def include).
          patch -p1 --batch < /tmp/Patches/OnePlus9R/susfs_fixed.patch

          # Apply the OnePlus 9R-specific 4.19 compatibility adapters.
          python3 "$GITHUB_WORKSPACE/.github/scripts/oneplus9r_compat.py" --patches /tmp/Patches

          if find . -name "*.rej" | grep -q .; then
            echo "[-] SUSFS fix patch left rejected hunks."
            find . -name "*.rej" -exec cat {} \;
            false
          fi

      - name: Attach FinaSU's missing SUSFS setresuid callback
        working-directory: device_kernel
        run: |
          # build-env moves the checked-out Patches directory to /tmp.
          patch_file=/tmp/Patches/OnePlus9R/finasu_setresuid_419.patch
          git apply --check "$patch_file"
          git apply "$patch_file"

      - name: Enable read-only FinaSU runtime diagnostics
        working-directory: device_kernel
        run: |
          python3 "$GITHUB_WORKSPACE/.github/scripts/oneplus9r_runtime_diag.py"

      - name: Attach manager-only ksud FD handoff
        working-directory: device_kernel
        run: |
          expected=f96445f966a2c3f4c1257938acf0449757be8a04
          actual=$(git -C FinaSU rev-parse HEAD)
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::Expected FinaSU $expected, found $actual"
            exit 1
          fi
          python3 "$GITHUB_WORKSPACE/.github/scripts/oneplus9r_manager_ksud_fd.py" \
            --apk "$MANAGER_APK" --source /tmp/Patches/OnePlus9R/finasu_manager_ksud_fd.c

      - name: Connect the privileged SUSFS control interface
        working-directory: device_kernel
        run: |
          patch_file=/tmp/Patches/OnePlus9R/finasu_susfs_control_419.patch
          git apply --check "$patch_file"
          git apply "$patch_file"
          echo 'ROM_TEXT=lineageos22_a15-v7-susfs-control-test' >> "$GITHUB_ENV"

      - name: 🪛 Extra Kernel Options
        run: |
          cd $GITHUB_WORKSPACE/device_kernel

          DEFCONFIG="arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}"

          # FinaSU built-in requirements / backends
          grep -q '^CONFIG_KSU=y$' "$DEFCONFIG" || echo "CONFIG_KSU=y" >> "$DEFCONFIG"
          grep -q '^CONFIG_KALLSYMS=y$' "$DEFCONFIG" || echo "CONFIG_KALLSYMS=y" >> "$DEFCONFIG"
          grep -q '^CONFIG_KALLSYMS_ALL=y$' "$DEFCONFIG" || echo "CONFIG_KALLSYMS_ALL=y" >> "$DEFCONFIG"
          grep -q '^CONFIG_EXT4_FS=y$' "$DEFCONFIG" || echo "CONFIG_EXT4_FS=y" >> "$DEFCONFIG"
          grep -q '^CONFIG_KSU_HOOK_TRACEPOINT=y$' "$DEFCONFIG" || echo "CONFIG_KSU_HOOK_TRACEPOINT=y" >> "$DEFCONFIG"

          # The generic SUSFS action writes this option without a value.
          sed -i 's/^CONFIG_KSU_SUSFS_PRIORITY_UID_FILTER$/CONFIG_KSU_SUSFS_PRIORITY_UID_FILTER=y/' "$DEFCONFIG"

          echo "::group::[+] FinaSU / SUSFS options"
          grep -E "CONFIG_(KSU|KALLSYMS|EXT4_FS)" "$DEFCONFIG" | sort -u
          echo "::endgroup::"

          # Sanity check FinaSU tree
          test -L drivers/kernelsu
          test -f drivers/kernelsu/Kbuild

      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process

      - name: Verify kernel configuration
        working-directory: device_kernel
        run: |
          kernel_release=$(<out/include/config/kernel.release)
          echo "Built kernel release: $kernel_release"
          if [[ "$kernel_release" != '4.19.325-perf+' ]]; then
            echo '::warning::Kernel release differs from the reported 4.19.325-perf+.'
          fi
          for option in CONFIG_KSU CONFIG_KSU_SUSFS CONFIG_KSU_HOOK_TRACEPOINT CONFIG_SECCOMP CONFIG_SECCOMP_FILTER CONFIG_SECURITY_SELINUX; do
            if ! grep -qxF "$option=y" out/.config; then
              echo "::error::$option is not enabled in the generated kernel config."
              exit 1
            fi
          done
          if grep -qxF 'CONFIG_KSU_DISABLE_MANAGER=y' out/.config; then
            echo '::error::The v6 FD handoff requires signature-based manager recognition.'
            exit 1
          fi
          if grep -qxF 'CONFIG_KSU_HOOK_SUSFS_INLINE=y' out/.config; then
            echo '::error::The v7 SUSFS control entry is for the Tracepoint backend only.'
            exit 1
          fi
          if ! grep -Eq ' [Tt] ksu_handle_sys_reboot$' out/System.map; then
            echo '::error::The v7 SUSFS control dispatcher is not linked.'
            exit 1
          fi
          printf 'Kernel release: `%s`\n\nTest only: retain v6 Root bootstrap and connect the privileged SUSFS control path. SELinux policy and hide behavior unchanged.\n' "$kernel_release" >> "$GITHUB_STEP_SUMMARY"

      - name: 🔩 Pack Process
        uses: ./.github/workflows/pack-process

      - name: ✏️ Upload Artifacts
        uses: ./.github/workflows/upload-files
